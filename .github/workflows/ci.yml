name: CI

on:
  push:
    # dev is here because it was not: four commits sat on it unverified before
    # v4.1.0, and the first real signal would otherwise have arrived from the
    # release workflow, at the moment of shipping.
    branches: [main, dev, v3]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated files match source
        run: |
          pnpm generate
          if ! git diff --quiet; then
            echo '::error::Generated files are out of date. Run `pnpm generate` and commit the result.'
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      # Runs after the generate-diff step, not before: prism owns the formatting
      # of everything it writes, so the wrapper packages are in .prettierignore
      # and the two never rewrite the same file. Formatting is not cosmetic here
      # — the CSS checks read declarations out of the css`` templates, and a rule
      # crushed onto one line is a rule they cannot see.
      - name: Formatting
        run: pnpm format:check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm test

      # The whole auto-discovered suite, not a hardcoded subset — a newly added
      # check file must run here, not just locally. Every check reads source or
      # files the `pnpm generate` step above produced (the ssr check imports the
      # component modules, icon-names reads the vendored icon resolvers); none
      # needs a browser, the docs build, or the network.
      - name: Check suite
        run: pnpm check

      - name: Typecheck generated declarations
        run: pnpm typecheck

  wrapper-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The per-icon modules are generated and gitignored — a fresh checkout
      # packs a web-components tarball without them, which is the v2.3.0
      # broken-publish all over again (the smoke test caught it here).
      - name: Generate vendored icons
        run: pnpm generate:icons

      # Compiles all six wrapper packages with their real toolchains —
      # including ng-packagr, whose strictTemplates pass is the Angular
      # verification (a scratch Angular consumer would cost a full CLI).
      - name: Build wrapper packages
        run: pnpm --filter @arclux/arc-ui-react --filter @arclux/arc-ui-preact --filter @arclux/arc-ui-solid --filter @arclux/arc-ui-svelte --filter @arclux/arc-ui-vue --filter @arclux/arc-ui-angular run build

      # Packs the real tarballs and builds a scratch Vite consumer per
      # framework — the check that resolves through npm's eyes, not the
      # workspace's.
      - name: Smoke-test packed tarballs
        run: pnpm smoke:wrappers

      # Here rather than in `verify`, because this is the only job with built
      # wrappers. `export-map.js` skips `./dist/...` targets when the package
      # has not been built — correct for a source checkout, but it meant the
      # half of the export map that points at build output was never checked
      # anywhere. It was hiding 18 published subpaths that resolved to files no
      # build produced: every tier barrel in @arclux/arc-ui-vue and
      # @arclux/arc-ui-solid, plus `./CodeBlock` in both.
      - name: Export maps resolve against built output
        run: node scripts/checks/export-map.js

  accessibility:
    runs-on: ubuntu-latest
    # The audit is ~730s of this job's ~825s; the docs build and the browser
    # install are noise beside it. Nothing inside the script is the bottleneck
    # either — it is 164 pages × 2 themes of axe on a 4-vCPU runner — so the
    # only real lever is running it in parallel. Four shards puts the job at
    # roughly the docs build plus a quarter of the pages, with no page audited
    # any less thoroughly than before.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: accessibility (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The per-icon modules are generated and gitignored, so a fresh
      # checkout can't build the docs (icon-registry.js imports them).
      # This job has been the only red lane since v2.3.0 for exactly
      # this reason — the verify job gets them via its pnpm generate.
      - name: Generate vendored icons
        run: pnpm generate:icons

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build docs
        run: pnpm build:docs

      - name: axe-core audit (fails on serious/critical)
        # Through env rather than interpolated into the command. The value is a
        # literal from the matrix above and not attacker-controlled, but a run:
        # line is the wrong place to learn that distinction by exception.
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm audit:a11y -- --shard="$SHARD/4"

  # Its own job, not a step in `verify`, for two reasons that are both about
  # scripts/mutate.js rewriting its source file in place: it must never share a
  # working tree with the `git diff --quiet` generated-files check, and it must
  # never run alongside the ordinary suite — that combination has already
  # produced a "3668 passed, 0 failed" report that also contained a ❌, because
  # a test file was reading a source file mid-write.
  #
  # It is also ~5 minutes of re-running one scoped test file per mutant, which
  # has no business on the critical path to a green PR.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # props.test.js does not import an icon module, but the pretest hook that
      # regenerates them is a `pnpm test` hook and mutate.js calls the runner
      # directly — so a fresh checkout needs them here explicitly.
      - name: Generate vendored icons
        run: pnpm generate:icons

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The sampled set — ten shared modules, each gated just under its measured
      # score so the numbers only ever ratchet up. props.js carries the highest
      # threshold: 166 components sit on it, so a survivor there is a hole under
      # all of them at once.
      #
      # listbox-controller and position-controller were skipped here while they
      # sat at `gate: null` — reported but unenforced — rather than passing
      # silently, then briefly gated at their first honest floors of 50 and 52.
      # V4-PLAN 2.5 climbed them to 98.68% and 88.46% and the gates now sit at
      # 95 and 85. All ten are enforced.
      #
      # This job is the slow one, and deliberately separate: mutate.js rewrites
      # its source file in place, so it must not share a working tree with the
      # generate-diff step or the suite.
      - name: Sampled mutation gate
        run: pnpm mutate:sample

  # Mounts every wrapper package in a real browser — the only job that does.
  # `wrapper-builds` proves a tarball compiles inside a consumer, which a
  # wrapper that drops every child it is handed, or that never registers the
  # custom element it wraps, passes without complaint. Both of those are real
  # and pinned (findings #80–#82).
  #
  # Its own job because it packs six tarballs, npm-installs six scratch
  # consumers and runs six real framework builds (the Angular CLI among them) —
  # ~10 minutes that has no business on the critical path to a green PR, and
  # network access that the `verify` job deliberately does not need.
  wrapper-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The per-icon modules are generated and gitignored, and packing without
      # them is the v2.3.0 broken publish. The harness refuses to start without
      # them rather than failing inside a scratch app's bundler output.
      - name: Generate vendored icons
        run: pnpm generate:icons

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wrapper runtime matrix
        run: pnpm test:wrappers
