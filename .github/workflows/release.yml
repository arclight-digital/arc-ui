name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # fetch-depth: 0 because the publish scope is "what changed since the
      # previous tag", and the default shallow clone reaches neither the tag
      # nor the history between them. Without it release-scope.js cannot
      # answer, and before v4.1.0 the step it replaced answered anyway — it
      # took its own "no previous tag" branch and published all twelve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # No registry-url / NODE_AUTH_TOKEN: pnpm >=10.13 performs the OIDC
      # trusted-publishing exchange natively, and an auth entry in .npmrc
      # (even an empty one) makes it use that instead of OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated files match source
        run: |
          pnpm generate
          if ! git diff --quiet; then
            echo '::error::Generated files are out of date. Run `pnpm generate` and commit the result.'
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      # A tag on a red commit must not publish. Same gates as ci.yml's verify
      # and wrapper-builds jobs: browser tests, the full check suite, and the
      # packed-tarball smoke test — all against the tree `pnpm generate`
      # produced above (the checks and the smoke test need its outputs).
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm test

      - name: Check suite
        run: pnpm check

      - name: Smoke-test packed tarballs
        run: pnpm smoke:wrappers

      # The per-icon modules are generated and gitignored, so a fresh CI
      # checkout only has them because `pnpm generate` ran above. Pack the
      # tarball and prove the critical files made it in — v2.3.0 shipped
      # without them and broke every consumer build.
      # The per-glyph modules are generated and gitignored, so nothing else
      # notices a tarball packed without them. They lived in core before 4.7
      # moved the packs to their own package; the check moved with them.
      - name: Tarball contains generated icon modules
        run: |
          cd packages/icons
          TARBALL="$(pnpm pack | tail -n1)"
          for f in src/phosphor/_resolver.js src/lucide/_resolver.js src/phosphor/_manifest.js src/lucide/_manifest.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "package/$f"; then
              echo "::error::$f is missing from the npm tarball"
              exit 1
            fi
          done
          rm "$TARBALL"

      - name: Tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/web-components/package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION. Run pnpm bump-versions first."
            exit 1
          fi

      # Which packages this tag actually publishes — see
      # scripts/release-scope.js, which carries the reasoning and the two ways
      # the inline version of this step silently published everything instead.
      # It is runnable outside CI (`node scripts/release-scope.js v4.1.0`),
      # which is how its answer is checked before a tag rather than after.
      #
      # Assigned to a variable rather than interpolated straight into the echo:
      # `echo "filter=$(cmd)"` reports echo's exit status, so a script that
      # refused to guess would leave an empty filter and `pnpm publish` would
      # take that as "everything" — the same silent-fallback shape being fixed
      # here. A bare assignment propagates the substitution's status under
      # `set -e`, and the empty check covers the rest.
      - name: Choose packages to publish
        id: scope
        run: |
          FILTER="$(node scripts/release-scope.js "$GITHUB_REF_NAME")"
          if [ -z "$FILTER" ]; then
            echo "::error::release-scope produced no filter — refusing to publish."
            exit 1
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

      # OIDC trusted publishing: no token; provenance is generated
      # automatically. NPM_CONFIG_PROVENANCE stays as a guard so a silent
      # fallback to tokenless-unsigned publishing can never happen.
      # --no-git-checks is required on a detached tag checkout.
      - name: Publish
        run: pnpm ${{ steps.scope.outputs.filter }} publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
