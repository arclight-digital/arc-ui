name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No registry-url / NODE_AUTH_TOKEN: pnpm >=10.13 performs the OIDC
      # trusted-publishing exchange natively, and an auth entry in .npmrc
      # (even an empty one) makes it use that instead of OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated files match source
        run: |
          pnpm generate
          if ! git diff --quiet; then
            echo '::error::Generated files are out of date. Run `pnpm generate` and commit the result.'
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      # A tag on a red commit must not publish. Same gates as ci.yml's verify
      # and wrapper-builds jobs: browser tests, the full check suite, and the
      # packed-tarball smoke test — all against the tree `pnpm generate`
      # produced above (the checks and the smoke test need its outputs).
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm test

      - name: Check suite
        run: pnpm check

      - name: Smoke-test packed tarballs
        run: pnpm smoke:wrappers

      # The per-icon modules are generated and gitignored, so a fresh CI
      # checkout only has them because `pnpm generate` ran above. Pack the
      # tarball and prove the critical files made it in — v2.3.0 shipped
      # without them and broke every consumer build.
      # The per-glyph modules are generated and gitignored, so nothing else
      # notices a tarball packed without them. They lived in core before 4.7
      # moved the packs to their own package; the check moved with them.
      - name: Tarball contains generated icon modules
        run: |
          cd packages/icons
          TARBALL="$(pnpm pack | tail -n1)"
          for f in src/phosphor/_resolver.js src/lucide/_resolver.js src/phosphor/_manifest.js src/lucide/_manifest.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "package/$f"; then
              echo "::error::$f is missing from the npm tarball"
              exit 1
            fi
          done
          rm "$TARBALL"

      - name: Tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/web-components/package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION. Run pnpm bump-versions first."
            exit 1
          fi

      # Which packages this tag actually publishes.
      #
      # Every release published all nine at the same version whether or not
      # anything in them had changed, which puts eight identical tarballs on
      # npm per patch and makes a package's version history say nothing about
      # whether the package moved. pnpm's own `[<since>]` filter answers it
      # from git: the packages whose *files* changed since the previous tag.
      # Deliberately without the `...` dependents prefix — a wrapper whose
      # files did not change does not need republishing when core moves,
      # because the copy already on npm declares `^<older core>` and a caret
      # accepts the newer one.
      #
      # Except across a major, where a caret does not. A wrapper still
      # declaring ^3 refuses core 4 and the consumer gets a peer conflict on
      # upgrade, so a major republishes everything regardless of diff. This is
      # also the safe direction to be wrong in: the cost is a few identical
      # tarballs, and the cost of the other mistake is a broken upgrade path.
      - name: Choose packages to publish
        id: scope
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "No previous tag — publishing everything."
            echo "filter=-r" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_MAJOR="${GITHUB_REF_NAME#v}"; NEW_MAJOR="${NEW_MAJOR%%.*}"
          OLD_MAJOR="${PREV#v}"; OLD_MAJOR="${OLD_MAJOR%%.*}"
          if [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
            echo "Major bump $PREV → $GITHUB_REF_NAME — publishing everything."
            echo "filter=-r" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing packages changed since $PREV:"
            pnpm --filter "[$PREV]" list --depth -1 || true
            echo "filter=--filter [$PREV]" >> "$GITHUB_OUTPUT"
          fi

      # OIDC trusted publishing: no token; provenance is generated
      # automatically. NPM_CONFIG_PROVENANCE stays as a guard so a silent
      # fallback to tokenless-unsigned publishing can never happen.
      # --no-git-checks is required on a detached tag checkout.
      - name: Publish
        run: pnpm ${{ steps.scope.outputs.filter }} publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
